[package]
name = "vesta-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "VestaDesk is a native desktop super-app in Rust (egui/eframe) for Windows and Linux."
repository = "https://github.com/Reversat-Vincent/VestaDesk"
readme = "README.md"
keywords = ["gui", "egui", "desktop"]
categories = ["gui"]
publish = false

[dependencies]
# Renderer choice: explained in the `app` module docs (src/app.rs).
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "glow",
  "wayland",
  "x11",
] }
# Without egui's built-in fonts, here and in eframe: the app bundles its own (src/fonts.rs).
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Draws the title bar on Wayland desktops that leave it to apps, such as GNOME.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
tempfile = "3"
# Reads the bundled fonts in tests/fonts.rs, in the version that egui uses.
skrifa = "0.44"

# Lint policy, documented in CONTRIBUTING.md. clippy.toml allows unwrap/expect/panic in tests.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
