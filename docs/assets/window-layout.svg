<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" style="max-width: 100%; height: auto" role="img" aria-labelledby="wl-title wl-desc" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <title id="wl-title">Window layout</title>
    <desc id="wl-desc">The window has three areas. 1: the status bar, 22 pt high, runs along the bottom across the whole width. 2: the activity bar, 48 pt wide, takes the left side above it, with one item per page; the item of the open page is highlighted. 3: the page of the current route fills the rest and scrolls when it does not fit. show adds the areas in that order, and each takes its side of the space the earlier ones left, so the status bar runs under the activity bar.</desc>
    <style>
        .wl-bg { fill: #ffffff; }
        .wl-title { font-size: 22px; font-weight: 600; fill: #1f2328; }
        .wl-lead { font-size: 14px; fill: #59636e; }
        .wl-name { font-size: 15px; font-weight: 600; fill: #1f2328; }
        .wl-text { font-size: 13px; fill: #1f2328; }
        .wl-note { font-size: 12px; fill: #59636e; }
        .wl-aside { font-size: 13px; fill: #59636e; }
        .wl-code { font-family: Consolas, 'Cascadia Mono', Menlo, 'DejaVu Sans Mono', monospace; }
        .wl-frame { fill: none; stroke: #8c959f; stroke-width: 1.25; }
        .wl-chrome { fill: #f6f8fa; }
        .wl-panel { fill: #eef1f4; }
        .wl-page { fill: #ffffff; }
        .wl-line { stroke: #d1d9e0; stroke-width: 1; }
        .wl-item { font-size: 13px; fill: #1f2328; }
        .wl-item-on { fill: #ddf4ff; }
        .wl-item-on-text { font-size: 13px; font-weight: 600; fill: #0550ae; }
        .wl-heading { font-size: 18px; font-weight: 600; fill: #1f2328; }
        .wl-content { fill: #eaeef2; }
        .wl-scroll { fill: #afb8c1; }
        .wl-badge, .wl-dot { fill: #0969da; }
        .wl-digit { font-size: 12px; font-weight: 600; fill: #ffffff; }
        .wl-leader { stroke: #0969da; stroke-width: 1.25; }
        @media (prefers-color-scheme: dark) {
            .wl-bg, .wl-page { fill: #0d1117; }
            .wl-title, .wl-name, .wl-text, .wl-item, .wl-heading { fill: #e6edf3; }
            .wl-lead, .wl-note, .wl-aside { fill: #9198a1; }
            .wl-frame { stroke: #656c76; }
            .wl-chrome { fill: #151b23; }
            .wl-panel { fill: #1b2129; }
            .wl-line { stroke: #3d444d; }
            .wl-item-on { fill: #172c47; }
            .wl-item-on-text { fill: #79c0ff; }
            .wl-content { fill: #21262d; }
            .wl-scroll { fill: #484f58; }
            .wl-badge { fill: #1f6feb; }
            .wl-dot { fill: #4493f8; }
            .wl-leader { stroke: #4493f8; }
        }
    </style>
    <defs>
        <clipPath id="wl-window">
            <rect x="64" y="104" width="600" height="474" rx="8"/>
        </clipPath>
    </defs>
    <rect class="wl-bg" width="1120" height="610"/>
    <text class="wl-title" x="32" y="48">Window layout</text>
    <text class="wl-lead" x="32" y="74">The status bar runs along the bottom, the activity bar takes the left side above it, and the page fills the rest.</text>
    <!-- The window at three quarters of its opening size (800 × 600 pt): the title bar, then the three areas -->
    <g clip-path="url(#wl-window)">
        <rect class="wl-chrome" x="64" y="104" width="600" height="24"/>
        <rect class="wl-page" x="100" y="128" width="564" height="433.5"/>
        <rect class="wl-panel" x="64" y="128" width="36" height="433.5"/>
        <rect class="wl-panel" x="64" y="561.5" width="600" height="16.5"/>
    </g>
    <line class="wl-line" x1="64" y1="128" x2="664" y2="128"/>
    <line class="wl-line" x1="100" y1="128" x2="100" y2="561.5"/>
    <line class="wl-line" x1="64" y1="561.5" x2="664" y2="561.5"/>
    <rect class="wl-frame" x="64" y="104" width="600" height="474" rx="8"/>
    <text class="wl-note" x="364" y="120.5" text-anchor="middle">VestaDesk</text>
    <!-- Activity bar items: Home, Settings (the open page) and About -->
    <text class="wl-item" x="82" y="151" text-anchor="middle">H</text>
    <rect class="wl-item-on" x="67" y="162" width="30" height="24" rx="4"/>
    <text class="wl-item-on-text" x="82" y="179" text-anchor="middle">S</text>
    <text class="wl-item" x="82" y="207" text-anchor="middle">A</text>
    <!-- The Settings page, with a scroll bar for content that does not fit -->
    <text class="wl-heading" x="116" y="158">Settings</text>
    <rect class="wl-content" x="116" y="176" width="380" height="8" rx="4"/>
    <rect class="wl-content" x="116" y="194" width="440" height="8" rx="4"/>
    <rect class="wl-content" x="116" y="212" width="300" height="8" rx="4"/>
    <rect class="wl-content" x="116" y="240" width="410" height="8" rx="4"/>
    <rect class="wl-content" x="116" y="258" width="350" height="8" rx="4"/>
    <rect class="wl-scroll" x="653" y="134" width="5" height="180" rx="2.5"/>
    <!-- Numbered markers: the order in which show adds the areas -->
    <line class="wl-leader" x1="630" y1="569.75" x2="680" y2="569.75"/>
    <circle class="wl-dot" cx="630" cy="569.75" r="2.5"/>
    <circle class="wl-badge" cx="690" cy="569.75" r="10"/>
    <text class="wl-digit" x="690" y="574" text-anchor="middle">1</text>
    <line class="wl-leader" x1="52" y1="345" x2="82" y2="345"/>
    <circle class="wl-dot" cx="82" cy="345" r="2.5"/>
    <circle class="wl-badge" cx="42" cy="345" r="10"/>
    <text class="wl-digit" x="42" y="349.25" text-anchor="middle">2</text>
    <line class="wl-leader" x1="630" y1="345" x2="680" y2="345"/>
    <circle class="wl-dot" cx="630" cy="345" r="2.5"/>
    <circle class="wl-badge" cx="690" cy="345" r="10"/>
    <text class="wl-digit" x="690" y="349.25" text-anchor="middle">3</text>
    <!-- What each area is -->
    <circle class="wl-badge" cx="740" cy="135" r="10"/>
    <text class="wl-digit" x="740" y="139.25" text-anchor="middle">1</text>
    <text class="wl-name" x="760" y="140">Status bar</text>
    <text class="wl-text" x="760" y="162">22 pt high, across the whole width</text>
    <text class="wl-note wl-code" x="760" y="181">STATUS_BAR_HEIGHT</text>
    <circle class="wl-badge" cx="740" cy="221" r="10"/>
    <text class="wl-digit" x="740" y="225.25" text-anchor="middle">2</text>
    <text class="wl-name" x="760" y="226">Activity bar</text>
    <text class="wl-text" x="760" y="248">48 pt wide; the user cannot resize it</text>
    <text class="wl-text" x="760" y="267">one item per page, in the order of <tspan class="wl-code">Route::ALL</tspan></text>
    <text class="wl-text" x="760" y="286">the item of the open page is highlighted</text>
    <text class="wl-note wl-code" x="760" y="305">ACTIVITY_BAR_WIDTH</text>
    <circle class="wl-badge" cx="740" cy="345" r="10"/>
    <text class="wl-digit" x="740" y="349.25" text-anchor="middle">3</text>
    <text class="wl-name" x="760" y="350">Page</text>
    <text class="wl-text" x="760" y="372">the page of the current route</text>
    <text class="wl-text" x="760" y="391">fills the rest, and scrolls when it does not fit</text>
    <text class="wl-text" x="760" y="410">each page keeps its own scroll position</text>
    <text class="wl-aside" x="728" y="462"><tspan class="wl-code">show</tspan> adds the areas in this order: each one takes</text>
    <text class="wl-aside" x="728" y="481">its side of the space the earlier ones left, so the</text>
    <text class="wl-aside" x="728" y="500">status bar runs under the activity bar.</text>
    <text class="wl-aside" x="728" y="532">The window opens at 800 × 600 pt and can shrink</text>
    <text class="wl-aside" x="728" y="551">to 640 × 480 pt.</text>
</svg>
